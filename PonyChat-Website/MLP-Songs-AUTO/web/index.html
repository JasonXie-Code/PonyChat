<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <title>MLP Music AUTO - PonyChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/auto.css?v=20260509c" />
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>

  <header class="top">
    <button type="button" class="btn-menu" id="btnMenu" aria-label="打开侧栏">☰</button>
    <a class="brand" href="https://ponychat.org" target="_blank" rel="noopener">
      <img class="logo-img" src="/logo.png" alt="PonyChat" />
      <span class="brand-text">MLP Music</span>
    </a>
    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" role="tab" aria-selected="true">AUTO</button>
      <a class="tab auto-link" href="/scores/catchy-song.pdf" target="_blank" rel="noopener">PDF</a>
    </nav>
    <div class="search-wrap">
      <input type="search" id="q" class="search" placeholder="You're In My Head Like a Catchy Song" autocomplete="off" />
    </div>
    <button type="button" class="btn-search-icon" id="btnSearchIcon" aria-label="搜索">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </button>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="shell auto-shell">
    <aside class="sidebar" id="sidebar">
      <div class="auto-sidebar-tabs" role="tablist" aria-label="侧栏分栏">
        <button type="button" class="auto-sidebar-tab active" data-sidebar-tab="songs" role="tab" aria-selected="true">歌曲列表</button>
        <button type="button" class="auto-sidebar-tab" data-sidebar-tab="analysis" role="tab" aria-selected="false">歌曲解析</button>
      </div>
      <div class="sidebar-section">
        <div class="auto-sidebar-pane active" data-sidebar-pane="songs">
        <p class="sidebar-title">当前歌曲</p>
        <div class="auto-song-card">
          <div class="auto-song-title" id="songTitle">You're In My Head Like a Catchy Song</div>
          <div class="auto-song-sub" id="songSub">My Little Pony S07E13</div>
          <button type="button" class="auto-primary" id="btnPlaySide">播放</button>
        </div>

        <p class="sidebar-title">自动识别报告</p>
        <div class="auto-kv" id="reportBox"></div>

        <p class="sidebar-title">乐理解析</p>
        <div class="auto-analysis" id="analysisBox"></div>
        </div>
      </div>
    </aside>

    <main class="main auto-main">
      <section class="panel active auto-panel">
        <div class="auto-stage-head">
          <div>
            <h1 id="stageTitle">You're In My Head Like a Catchy Song</h1>
            <p id="stageStatus">正在加载自动识别结果...</p>
          </div>
          <div class="auto-now">
            <div class="score-view-tabs" role="tablist" aria-label="谱面显示">
              <button type="button" class="score-view-tab active" data-score-view="staff" role="tab" aria-selected="true">五线谱</button>
              <button type="button" class="score-view-tab" data-score-view="jianpu" role="tab" aria-selected="false">简谱</button>
            </div>
            <span id="nowMeasure">M--</span>
            <span id="nowChord">--</span>
            <span id="nowLyric">--</span>
          </div>
        </div>

        <div class="auto-score-wrap" id="scoreWrap">
          <div class="auto-osmd" id="osmdWrap">
            <div id="osmdScore"></div>
          </div>
          <div class="auto-page" data-page="1">
            <img src="/charts/MLP713 In My Head Like a Catchy song CHART R4 EDIT_00.png" alt="Score page 1" />
            <div class="auto-cursor" id="cursor1"></div>
          </div>
          <div class="auto-page" data-page="2">
            <img src="/charts/MLP713 In My Head Like a Catchy song CHART R4 EDIT_01.png" alt="Score page 2" />
            <div class="auto-cursor" id="cursor2"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer class="player" id="player">
    <div class="player-progress">
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="进度" />
      <span class="time time-combined" id="timeLabel">0:00 / 0:00</span>
      <div class="player-progress-mobile-times">
        <span class="time-current" id="timeCurrent">0:00</span>
        <span class="time-total" id="timeTotal">0:00</span>
      </div>
    </div>
    <div class="player-now">
      <div class="player-art" id="playerArt"></div>
      <div class="player-meta">
        <div class="player-title" id="playerTitle">You're In My Head Like a Catchy Song</div>
        <div class="player-sub" id="playerSub">自动跟谱演示</div>
      </div>
      <div class="player-controls">
        <button type="button" id="btnPrev" class="btn-icon" title="上一段" aria-label="上一段">
          <svg class="btn-icon-svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 5h2v14H4zM10 12L20 5v14L10 12z"/></svg>
        </button>
        <button type="button" id="btnPlay" class="btn-icon primary btn-play" title="播放/暂停" aria-label="播放">
          <svg class="btn-play-icon icon-play" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M8 5.82v12.36c0 .79.86 1.28 1.54.88l9.51-6.18a1 1 0 0 0 0-1.68l-9.51-6.18c-.68-.4-1.54.09-1.54.88z"/></svg>
          <svg class="btn-play-icon icon-pause hidden" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H7zm8 0a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2z"/></svg>
        </button>
        <button type="button" id="btnNext" class="btn-icon" title="下一段" aria-label="下一段">
          <svg class="btn-icon-svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 5l12 7-12 7V5zm14 0h2v14h-2V5z"/></svg>
        </button>
      </div>
    </div>
    <div class="player-vol">
      <span class="vol-icon" aria-hidden="true">
        <svg class="vol-icon-svg" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.5-.8-2.8-2-3.5v7c1.2-.7 2-2 2-3.5zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c3.9-.91 7-4.24 7-8.77s-3.1-7.86-7-8.77z"/></svg>
      </span>
      <input type="range" id="vol" min="0" max="100" value="100" aria-label="音量" />
    </div>
    <a id="downloadCurrent" class="btn-dl" href="/audio/catchy-song.mp3" download>下载</a>
  </footer>

  <audio id="audio" preload="metadata" src="/audio/catchy-song.mp3"></audio>
  <script src="/vendor/opensheetmusicdisplay.min.js"></script>
  <script src="/app.js?v=20260509d" defer></script>
</body>
</html>
