    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# 子域静态站（与上共用同一张 LE 证书；证书须含该主机名 SAN）。
# 若尚未执行 certbot --expand 加入 mbti，请暂时注释下一段 server，避免浏览器证书与主机名不一致。
server {
    listen 127.0.0.1:8443 ssl;
    server_name mbti.ponychat.org;

    ssl_certificate /etc/letsencrypt/live/www.ponychat.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ponychat.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mbti-ponychat-static;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

