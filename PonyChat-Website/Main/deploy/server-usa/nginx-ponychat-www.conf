# Server-USA (154.17.23.237)：www.ponychat.org + ponychat.org + admin.ponychat.org + database.ponychat.org + drive.ponychat.org — 统一 Vue SPA
# TLS @ 127.0.0.1:8443（stream 公网 443 SNI 转发至此端口）
# 站点根：/var/www/ponychat-static（frontend/dist）
# 后端反代：/api/ /ws/ /download/ → 127.0.0.1:5000
# 头像与聊天图（FastAPI routes/system）：须反代，不可落到 SPA try_files
# /logo/：静态文件优先，动态头像回落后端
#
# 安装：
#   sudo install -m 0644 nginx-ponychat-www.conf /etc/nginx/sites-available/ponychat-www
#   sudo ln -sf /etc/nginx/sites-available/ponychat-www /etc/nginx/sites-enabled/
# 扩展证书加入 admin/database/drive 等子域：
#   certbot certonly --webroot --expand --cert-name www.ponychat.org \
#     -w /var/www/html -d www.ponychat.org -d ponychat.org -d mbti.ponychat.org -d standard-mbti.ponychat.org -d admin.ponychat.org -d database.ponychat.org -d drive.ponychat.org \
#     -w /var/www/certbot -d great-bridge.ponychat.org -d great-bridge-aiopc.ponychat.org -d great-bridge-cq.ponychat.org -d server.ponychat.org \
#     --non-interactive --agree-tos
# stream map 须加入：admin.ponychat.org / database.ponychat.org / drive.ponychat.org  127.0.0.1:8443;

upstream ponychat_backend {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.ponychat.org ponychat.org mbti.ponychat.org standard-mbti.ponychat.org admin.ponychat.org database.ponychat.org drive.ponychat.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name www.ponychat.org ponychat.org;
    client_max_body_size 30m;

    ssl_certificate /etc/letsencrypt/live/www.ponychat.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ponychat.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/ponychat-static;
    index index.html;

    location ^~ /api/drive {
        return 404;
    }

    location ~ ^/(api|ws|download)(/|$) {
        proxy_pass http://ponychat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location = /api/chat {
        proxy_pass http://ponychat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/(character_data|user_data|chat_images)(/|$) {
        proxy_pass http://ponychat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /logo/ {
        try_files $uri @logo_backend_main;
    }
    location @logo_backend_main {
        proxy_pass http://ponychat_backend;
        proxy_set_header Host $host;
    }

    location = /drive {
        return 404;
    }

    location ^~ /drive/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

