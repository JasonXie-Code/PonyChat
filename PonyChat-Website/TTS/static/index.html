<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta http-equiv="refresh" content="0; url=/qwen3tts/">
  <title>PonyChat Voice</title>
  <link rel="icon" type="image/png" href="/logo/favicon.png">
  <link rel="apple-touch-icon" href="/logo/favicon.png">
  <link rel="stylesheet" href="/assets/voice.css?v=splitroutes">
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="/">
        <img src="/logo/logoBK512.png" alt="" class="logo-img" width="44" height="44" decoding="async">
        <span class="brand-text">PonyChat Voice</span>
      </a>
      <nav class="header-nav" aria-label="页面导航">
        <a href="https://ponychat.org/" target="_blank" rel="noopener noreferrer">PonyChat</a>
        <a href="https://llm.ponychat.org/" target="_blank" rel="noopener noreferrer">LLM</a>
      </nav>
    </header>

    <main class="landing-app">
      <section class="landing-head">
        <p class="hero-eyebrow">Voice Studio</p>
        <h1>选择一个语音工作台</h1>
      </section>

      <section class="engine-grid" aria-label="语音模型选择">
        <a class="engine-card" href="/qwen3tts/">
          <span class="engine-kicker">Local GPU Qwen3TTS</span>
          <strong>Qwen3TTS</strong>
          <span>RTX 4090 D 服务：支持语音克隆、音色设计、预置音色与分段情绪合成。</span>

      </section>
    </main>

  <script>location.replace("/qwen3tts/");</script>
