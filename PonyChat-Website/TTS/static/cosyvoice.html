<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>PonyChat CosyVoiceTTS</title>
  <link rel="icon" type="image/png" href="/logo/favicon.png">
  <link rel="apple-touch-icon" href="/logo/favicon.png">
  <link rel="stylesheet" href="/assets/voice.css?v=cosyvoice-20260612d">
</head>
<body data-api-base="/cosyvoice">
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="/cosyvoice/">
        <img src="/logo/logoBK512.png" alt="" class="logo-img" width="44" height="44" decoding="async">
        <span class="brand-text">PonyChat CosyVoiceTTS</span>
      </a>
      <nav class="header-nav" aria-label="页面导航">
        <a href="https://ponychat.org/" target="_blank" rel="noopener noreferrer">PonyChat</a>
      </nav>
    </header>

    <main class="voice-app">
      <section class="app-head">
        <div>
          <p class="hero-eyebrow">CosyVoiceTTS</p>
          <h1>百炼官方在线语音合成</h1>
        </div>
        <div class="status-strip">
          <span id="backendStatus">连接中</span>
          <span id="speedStatus">DashScope</span>
        </div>
      </section>

      <section class="workspace">
        <aside class="voice-rail" id="voices">
          <div class="panel-head">
            <h2>系统音色</h2>
            <button class="ghost-btn" id="refreshVoices" type="button">刷新</button>
          </div>
          <div id="voiceList" class="voice-list" aria-live="polite"></div>
        </aside>

        <section class="tool-panel">
          <div class="tabs" role="tablist" aria-label="CosyVoiceTTS 工作区">
            <button class="tab active" type="button" data-tab="synth">合成</button>
            <button class="tab" type="button" data-tab="clone">克隆</button>
            <button class="tab" type="button" data-tab="design">设计</button>
            <button class="tab" type="button" data-tab="library">管理</button>
          </div>

          <form class="tab-pane active" id="synthPane" data-pane="synth">
            <label>
              <span>声音</span>
              <select id="ttsVoice"></select>
            </label>
            <div class="seg-mode-bar">
              <span>内容与风格</span>
              <button class="ghost-btn" type="button" id="segToggle" aria-pressed="false">分段风格</button>
            </div>
            <div id="ttsSingleBlock">
              <label>
                <span>风格指令（可留空）</span>
                <input id="ttsInstruct" type="text" placeholder="如：温柔地、语速稍慢、带一点距离感">
              </label>
              <label>
                <span>文本</span>
                <textarea id="ttsText" rows="5">今天的云很低，像把所有秘密都压在了窗边。</textarea>
              </label>
            </div>
            <div id="ttsSegmentsBlock" hidden>
              <span class="seg-hint">每段可以给一个风格指令，提交时会合并为一次官方 API 请求。</span>
              <div id="ttsSegments"></div>
              <button class="secondary-btn" type="button" id="segAdd">+ 添加段落</button>
            </div>
            <div class="actions">
              <button class="primary-btn" type="submit">生成语音</button>
              <span class="run-meta" id="ttsMeta"></span>
            </div>
          </form>

          <form class="tab-pane" id="clonePane" data-pane="clone">
            <label>
              <span>名称前缀</span>
              <input id="cloneName" type="text" placeholder="ponyvoice">
            </label>
            <label>
              <span>参考音频</span>
              <input id="cloneAudio" type="file" accept="audio/*">
            </label>
            <label>
              <span>样本语种</span>
              <select id="cloneLanguage">
                <option value="zh" selected>中文</option>
                <option value="en">英文</option>
                <option value="ja">日语</option>
                <option value="ko">韩语</option>
                <option value="fr">法语</option>
                <option value="de">德语</option>
              </select>
            </label>
            <label>
              <span>试音文本</span>
              <textarea id="clonePreviewText" rows="3">今晚的风很轻，我会把你的名字留在星光里。</textarea>
            </label>
            <div class="actions">
              <button class="primary-btn" type="submit">创建克隆声音</button>
              <span class="run-meta" id="cloneMeta"></span>
            </div>
          </form>

          <form class="tab-pane" id="designPane" data-pane="design">
            <label>
              <span>名称前缀</span>
              <input id="designName" type="text" placeholder="narrator">
            </label>
            <label>
              <span>音色描述</span>
              <textarea id="designPrompt" rows="4">年轻女性旁白，声音温柔神秘，语速稍慢，适合奇幻角色扮演。</textarea>
            </label>
            <label>
              <span>预览文本</span>
              <textarea id="designPreviewText" rows="3">晨光落在旧城门上，我们用温柔而清晰的声音说：今天也要勇敢前行。</textarea>
            </label>
            <div class="actions">
              <button class="primary-btn" type="submit">设计并保存</button>
              <span class="run-meta" id="designMeta"></span>
            </div>
          </form>

          <section class="tab-pane library-pane" data-pane="library">
            <div class="panel-head">
              <h2>声音管理</h2>
              <button class="ghost-btn" id="libraryRefresh" type="button">刷新列表</button>
            </div>
            <div id="voiceTable" class="voice-table"></div>
          </section>
        </section>
      </section>

      <section class="player-panel">
        <div>
          <p class="hero-eyebrow">Output</p>
          <h2 id="outputTitle">等待生成</h2>
        </div>
        <div class="voice-player" id="voicePlayer">
          <button class="player-btn play-btn" id="playButton" type="button" aria-label="播放">
            <span class="play-icon" aria-hidden="true"></span>
          </button>
          <div class="timeline">
            <div class="time-row">
              <span id="currentTime">0:00</span>
              <span id="durationTime">0:00</span>
            </div>
            <input id="seekBar" class="range-control" type="range" min="0" max="1000" value="0" aria-label="播放进度">
          </div>
        </div>
        <button class="mobile-effect-toggle" id="mobileMicToggle" type="button" aria-pressed="false">手机拾音模拟</button>
        <audio id="audioPlayer" preload="auto"></audio>
        <a class="download-link disabled" id="downloadLink" href="#" download="cosyvoice.wav">下载 WAV</a>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/assets/cosyvoice.js?v=20260612d" defer></script>
</body>
</html>
