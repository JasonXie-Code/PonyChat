<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <title>MLP Music — PonyChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>

  <!-- 顶栏 -->
  <header class="top">
    <button type="button" class="btn-menu" id="btnMenu" aria-label="打开侧边栏">☰</button>
    <a class="brand" href="https://ponychat.org" target="_blank" rel="noopener">
      <img class="logo-img" src="/logo.png" alt="PonyChat" />
      <span class="brand-text">MLP Music</span>
    </a>
    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="music" role="tab" aria-selected="true">音乐</button>
      <button type="button" class="tab" data-tab="scores" role="tab" aria-selected="false">乐谱</button>
    </nav>
    <div class="search-wrap">
      <input type="search" id="q" class="search" placeholder="搜索曲目或乐谱…" autocomplete="off" />
    </div>
    <button type="button" class="btn-search-icon" id="btnSearchIcon" aria-label="搜索">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </button>
  </header>

  <!-- 侧边栏遮罩（音乐 / 乐谱共用） -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- 主体 -->
  <div class="shell">
    <!-- 统一侧边栏：按 Tab 切换「专辑筛选」或「乐谱列表」 -->
    <aside class="sidebar" id="sidebar">
      <div id="sidebarSectionMusic" class="sidebar-section sidebar-section--music">
        <p class="sidebar-title">专辑筛选</p>
        <ul class="album-filter" id="albumFilter"></ul>
      </div>
      <div id="sidebarSectionScores" class="sidebar-section sidebar-section--scores hidden">
        <p class="sidebar-title">乐谱列表</p>
        <ul id="scoreList" class="score-list"></ul>
      </div>
    </aside>

    <main class="main">
      <!-- 音乐面板 -->
      <section id="panelMusic" class="panel active">
        <div id="albumGrid" class="album-grid"></div>
        <div id="trackPanel" class="track-panel hidden">
          <button type="button" class="back" id="backAlbum">← 返回专辑</button>
          <h2 id="trackPanelTitle"></h2>
          <ul id="trackList" class="track-list"></ul>
        </div>
      </section>

      <!-- 乐谱面板（列表在统一侧边栏，此处仅预览区） -->
      <section id="panelScores" class="panel">
        <div class="score-viewer" id="scoreViewer">
          <!-- 导航栏（加载乐谱后显示） -->
          <div class="score-nav hidden" id="scoreNav">
            <div class="score-nav-controls">
              <button type="button" class="btn-score-nav" id="btnScorePrev" title="上一页" disabled>‹</button>
              <span class="score-page-label" id="scorePageLabel">1 / 1</span>
              <button type="button" class="btn-score-nav" id="btnScoreNext" title="下一页" disabled>›</button>
            </div>
            <button type="button" class="btn-score-dl-page" id="btnDownloadPage" title="下载当前页为 PNG 图片">↓ 下载当前页</button>
          </div>
          <div class="score-canvas-wrap" id="scoreCanvasWrap">
            <p class="pdf-hint" id="pdfHint">← 从侧边栏选择乐谱</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 底部播放器（桌面：左为封面/控制，中为进度；手机：上进度下主控区） -->
  <footer class="player" id="player">
    <div class="player-progress">
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="进度" />
      <span class="time time-combined" id="timeLabel">0:00 / 0:00</span>
      <div class="player-progress-mobile-times">
        <span class="time-current" id="timeCurrent">0:00</span>
        <span class="time-total" id="timeTotal">0:00</span>
      </div>
    </div>
    <div class="player-now">
      <div class="player-art" id="playerArt"></div>
      <div class="player-meta">
        <div class="player-title" id="playerTitle">未播放</div>
        <div class="player-sub" id="playerSub"></div>
      </div>
      <div class="player-controls">
        <button type="button" id="btnPrev" class="btn-icon" title="上一首" aria-label="上一首">
          <svg class="btn-icon-svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <!-- 左竖条 + 指向左的三角（顶点在左，底边在右） -->
            <path fill="currentColor" d="M4 5h2v14H4zM10 12L20 5v14L10 12z"/>
          </svg>
        </button>
        <button type="button" id="btnPlay" class="btn-icon primary btn-play" title="播放/暂停" aria-label="播放">
          <!-- 自绘 SVG，避免系统 emoji 在部分机型上出现橙色描边 -->
          <svg class="btn-play-icon icon-play" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M8 5.82v12.36c0 .79.86 1.28 1.54.88l9.51-6.18a1 1 0 0 0 0-1.68l-9.51-6.18c-.68-.4-1.54.09-1.54.88z"/>
          </svg>
          <svg class="btn-play-icon icon-pause hidden" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M7 5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H7zm8 0a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2z"/>
          </svg>
        </button>
        <button type="button" id="btnNext" class="btn-icon" title="下一首" aria-label="下一首">
          <svg class="btn-icon-svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M4 5l12 7-12 7V5zm14 0h2v14h-2V5z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="player-vol">
      <span class="vol-icon" aria-hidden="true">
        <svg class="vol-icon-svg" viewBox="0 0 24 24" width="18" height="18" focusable="false">
          <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.5-.8-2.8-2-3.5v7c1.2-.7 2-2 2-3.5zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c3.9-.91 7-4.24 7-8.77s-3.1-7.86-7-8.77z"/>
        </svg>
      </span>
      <input type="range" id="vol" min="0" max="100" value="100" aria-label="音量" />
    </div>
    <a id="downloadCurrent" class="btn-dl" href="#" download>下载</a>
  </footer>

  <audio id="audio" preload="metadata"></audio>

  <!-- 乐谱全屏预览（点击图片进入，左右滑动翻页） -->
  <div id="scoreLightbox" class="score-lightbox hidden" role="dialog" aria-modal="true" aria-label="乐谱全屏预览" aria-hidden="true">
    <div class="score-lightbox-backdrop" id="scoreLightboxBackdrop"></div>
    <button type="button" class="score-lightbox-close" id="btnScoreLightboxClose" aria-label="关闭">×</button>
    <div class="score-lightbox-chrome">
      <span id="scoreLightboxPageLabel" class="score-lightbox-page">1 / 1</span>
      <span class="score-lightbox-hint">左右滑动翻页</span>
    </div>
    <div class="score-lightbox-stage" id="scoreLightboxStage">
      <canvas id="scoreLightboxCanvas" class="score-lightbox-canvas"></canvas>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="/app.js" defer></script>
</body>
</html>
