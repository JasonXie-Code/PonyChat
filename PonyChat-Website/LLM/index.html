<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>PonyChat LLM</title>
  <link rel="icon" type="image/png" href="/logo/favicon.png">
  <link rel="apple-touch-icon" href="/logo/favicon.png">
  <link rel="stylesheet" href="/assets/katex/katex.min.css?v=0.16.11">
  <link rel="stylesheet" href="/assets/llm.css?v=23">
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="/">
        <img src="/logo/logoBK512.png" alt="" class="logo-img" width="44" height="44" decoding="async">
        <span class="brand-text">PonyChat LLM</span>
      </a>
      <nav class="header-nav" aria-label="页面导航">
        <a href="https://ponychat.org/" target="_blank" rel="noopener noreferrer">PonyChat</a>
        <a href="https://voice.ponychat.org/" target="_blank" rel="noopener noreferrer">TTS</a>
      </nav>
    </header>

    <main class="llm-app">
      <section class="app-head">
        <div>
          <p class="hero-eyebrow">Qwen3.6-27B · 本地推理</p>
          <h1>对话 · 视觉 · 推理</h1>
        </div>
        <div class="status-strip">
          <span id="connStatus">连接中</span>
          <span id="modelStatus">模型加载中</span>
          <span>RTX 3090</span>
        </div>
      </section>

      <section class="chat-shell">
        <div class="chat-toolbar">
          <div class="toolbar-left">
            <span class="model-chip" id="modelChip">qwen3.6-27b</span>
            <span class="caps-chip" id="capsChip">0Token/s 0Tokens</span>
          </div>
          <div class="toolbar-right">
            <button class="ghost-btn" id="settingsToggle" type="button" aria-pressed="false">参数</button>
            <button class="ghost-btn" id="newChat" type="button">新对话</button>
          </div>
        </div>

        <div class="chat-body">
          <div class="settings-panel" id="settingsPanel" hidden>
            <label class="full">
              <span>系统提示词</span>
              <textarea id="systemPrompt" rows="2" placeholder="可选。例如：你是 PonyChat 的智能助手，回答简洁、友好。"></textarea>
            </label>
            <div class="control-grid">
              <label>
                <span>思考模式</span>
                <select id="thinking">
                  <option value="on" selected>开启（显示思维链）</option>
                  <option value="off">关闭（直接回答）</option>
                </select>
              </label>
              <label>
                <span>温度</span>
                <input id="temperature" type="number" min="0" max="2" step="0.05" value="0.7">
              </label>
              <label>
                <span>最大生成长度</span>
                <input id="maxTokens" type="number" min="64" max="65536" step="256" value="65536">
              </label>
              <label>
                <span>候选范围</span>
                <input id="topP" type="number" min="0.1" max="1" step="0.05" value="0.9">
              </label>
            </div>
          </div>

          <div class="messages" id="messages" aria-live="polite"></div>
        </div>

        <form class="composer" id="composer">
          <div class="attach-row" id="attachRow" hidden></div>
          <div class="composer-input">
            <textarea id="input" rows="1" placeholder="给 Qwen3.6-27B 发消息…（回车发送，Shift+回车换行）"></textarea>
            <div class="composer-actions">
              <label class="icon-btn" id="attachBtn" title="添加图片（视觉理解）">
                <input id="imageInput" type="file" accept="image/*" multiple hidden>
                <span class="icon-img" aria-hidden="true"></span>
              </label>
              <button class="primary-btn" id="sendBtn" type="submit">发送</button>
              <button class="secondary-btn" id="stopBtn" type="button" hidden>停止</button>
            </div>
          </div>
        </form>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/assets/marked.min.js?v=12.0.2" defer></script>
  <script src="/assets/katex/katex.min.js?v=0.16.11" defer></script>
  <script src="/assets/katex/contrib/auto-render.min.js?v=0.16.11" defer></script>
  <script src="/assets/llm.js?v=29" defer></script>
</body>
</html>
