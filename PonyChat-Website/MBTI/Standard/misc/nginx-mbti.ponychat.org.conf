# Nginx：mbti.ponychat.org（SPA 回退）
# 用法：复制到服务器 /etc/nginx/sites-available/mbti.ponychat.org
#       sudo ln -sf /etc/nginx/sites-available/mbti.ponychat.org /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# 静态文件目录需与部署脚本 REMOTE_DIR 一致（默认 /var/www/mbti）
# HTTPS：DNS 生效后执行 sudo certbot --nginx -d mbti.ponychat.org

server {
    listen 80;
    listen [::]:80;
    server_name mbti.ponychat.org;

    root /var/www/mbti;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
