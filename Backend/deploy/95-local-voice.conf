# Install as /etc/systemd/system/ponychat-backend.service.d/95-local-voice.conf.
# Server-USA port 18012 forwards to the Windows Qwen3TTS service on port 8010.
[Service]
Environment=PONYCHAT_VOICE_ENABLED=1
Environment=PONYCHAT_VOICE_LAB_ENABLED=1
Environment=PONYCHAT_TTS_PROVIDER=voice_lab
Environment=PONYCHAT_VOICE_LAB_BASE_URL=http://127.0.0.1:18012
Environment=PONYCHAT_VOICE_LAB_DEFAULT_ENGINE=qwen3tts
