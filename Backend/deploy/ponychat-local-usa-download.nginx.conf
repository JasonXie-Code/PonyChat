# Included in the www.ponychat.org / ponychat.org virtual host.
# APK bytes come from P:\PonyChat; USA never buffers them to temporary files.
location = /download/apk {
    proxy_pass http://ponychat_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 300s;
    add_header Cache-Control no-cache;
}
location ^~ /releases/ {
    proxy_pass http://ponychat_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 300s;
    add_header Cache-Control no-cache;
}
