# Included inside the existing Server-CN IP virtual host (Scenery routes remain).
# App entry: http://39.101.74.217:80 -> SSH loopback 18500 -> P:\PonyChat:5000.
location ~ ^/(api|ws|download|releases|character_data|user_data|chat_images|logo)(/|$) {
    proxy_pass http://127.0.0.1:18500;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 10s;
    proxy_read_timeout 86400s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    add_header X-Accel-Buffering no;
}
