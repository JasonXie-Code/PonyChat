# Keep previously cached Drive web clients working while they still use the CN IP.
# Files and all operations are served by Server-USA, with verified HTTPS upstream.
location ^~ /api/drive/ {
    default_type application/json;
    if ($ponychat_plaintext_block) {
        return 426 '{"detail":"Please use HTTPS for Drive"}';
    }
    proxy_pass https://drive.ponychat.org;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name drive.ponychat.org;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_set_header Host drive.ponychat.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    client_max_body_size 50g;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
}
